# Minutes Pro on a server of your own, as on aibox1 at brainbot. Nothing here listens on
# the LAN except Caddy on BIND_IP, and Caddy only lets in ALLOW_CIDRS (the VPN clients).
name: indie-recorder

services:
  recorder:
    build: .
    image: indie-recorder:latest
    restart: unless-stopped
    # The box user (uid 1000) owns data/ and can read every meeting file.
    user: "1000:1000"
    env_file: .env
    environment:
      DATA_DIR: /data
      GITHUB_TOKEN_FILE: /secrets/github_token
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - scratch:/data/scratch
    ports:
      - "127.0.0.1:18000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [rec]

  # Mock GitHub and Drive for building and demos (FOLLOWUP_EXECUTOR=direct).
  mock:
    image: indie-recorder:latest
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-m", "mock.server"]
    environment:
      MOCK_STATE: /data/mock/state.json
      MOCK_PUBLIC_URL: ${PUBLIC_URL}/mock
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:18099:8099"
    networks: [rec]

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Host network so Caddy sees the real VPN client address for the allowlist
    # and binds to BIND_IP only.
    network_mode: host
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/tls:/certs:ro
    depends_on: [recorder]

  # Engine A, and the diarizer for engine B: NeMo-Speech.cpp on Vulkan (RADV).
  engine-nemo:
    build:
      context: engines
      dockerfile: nemo/Dockerfile
    image: indie-recorder-engine-nemo:latest
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["${VIDEO_GID:-44}", "${RENDER_GID:-992}"]
    devices: ["/dev/dri:/dev/dri"]
    environment:
      HOME: /data/.cache/engine-nemo
    volumes:
      - ./data:/data
      - ./models:/models:ro
      - scratch:/data/scratch
    networks: [rec]

  # Engine B: Qwen3-ASR + ForcedAligner on PyTorch ROCm (TheRock, gfx1151).
  # accent hints for naming speakers: whisper-accent on the CPU (engines/accent);
  # it sees only the plain audio the worker puts into the RAM scratch, and the model
  engine-accent:
    build:
      context: engines
      dockerfile: accent/Dockerfile
    image: indie-recorder-engine-accent:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      THREADS: "8"
    volumes:
      - ./models:/models:ro
      - scratch:/data/scratch
    networks: [rec]

  engine-qwen:
    build:
      context: engines
      dockerfile: qwen/Dockerfile
    image: indie-recorder-engine-qwen:latest
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["${VIDEO_GID:-44}", "${RENDER_GID:-992}"]
    devices: ["/dev/kfd:/dev/kfd", "/dev/dri:/dev/dri"]
    security_opt: ["seccomp=unconfined"]
    shm_size: 8g
    environment:
      HOME: /data/.cache/engine-qwen
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      # Measured on aibox1: AOTriton attention cuts Qwen3-ASR time by about 30%;
      # FAST find stops MIOpen from benchmarking kernels for every new chunk length.
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      MIOPEN_FIND_MODE: "FAST"
      IDLE_UNLOAD_S: "600"
    volumes:
      - ./data:/data
      - ./models:/models:ro
      - scratch:/data/scratch
    networks: [rec]

  # Benchmark tools (meeteval, pyannote.metrics); only with --profile bench.
  bench:
    build:
      context: .
      dockerfile: bench/Dockerfile
    image: indie-recorder-bench:latest
    profiles: ["bench"]
    user: "1000:1000"
    env_file: .env
    environment:
      DATA_DIR: /data
      HOME: /data/.cache/bench
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [rec]

networks:
  rec: {}

volumes:
  # Plain audio exists only here, in RAM, while a job converts or transcribes it
  # (meeting files on disk are encrypted, recorder/vault.py). Mounted at
  # /data/scratch: the engines take only paths under /data.
  scratch:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=8g,uid=1000,gid=1000,mode=0700"}
