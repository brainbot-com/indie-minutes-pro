<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}indie recorder{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/favicon.ico">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="dot"></span>indie recorder</a>
  {% if tok %}
  <nav>
    <a href="/app/">Record</a>
    {% if tok.role == 'admin' %}<a href="/devices" class="muted">Devices</a>{% endif %}
  </nav>
  {% endif %}
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer>indie recorder {{ version }} · <a href="/review">follow-ups</a> · <a href="/logout">log out</a></footer>
</body>
</html>
