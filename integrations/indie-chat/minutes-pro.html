:root {
  --paper: #ffffff; --ink: #111111; --muted: #555555; --ghost: #d9d9d9; --faint: #f2f2f2; --dim: #767676;
  --red: #e1251b; --red-dark: #b81d14; --on-red: #ffffff; color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #111111; --ink: #f2f2f2; --muted: #a3a3a3; --ghost: #3a3a3a; --faint: #1d1d1d; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111111; --ink: #f2f2f2; --muted: #a3a3a3; --ghost: #3a3a3a; --faint: #1d1d1d; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.45 "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;   /* without it Chromium on Linux rounds small caps apart: "T ODAY" */
}
button, input, select, textarea { font: inherit; color: inherit; text-rendering: inherit; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
[hidden] { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.red { color: var(--red); }

/* the bar at the top: brand left, state right, a 3px rule under it */
.bar {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px 18px;
  padding-bottom: 10px; border-bottom: 3px solid var(--ink);
  font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}
.bar > * { min-width: 0; white-space: nowrap; }
.bar .end { display: flex; gap: 18px; align-items: baseline; text-align: right; min-width: 0; }
.bar .end > * { overflow: hidden; text-overflow: ellipsis; }
.bar a, .bar button { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; letter-spacing: inherit; text-transform: inherit; font-weight: inherit; }
.bar a:hover, .bar button:hover { text-decoration: underline; }

/* the mark: the red record dot before the name */
.brand::before { content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--red);
  margin-right: .45em; vertical-align: -.08em; }

/* type */
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.kicker.live { color: var(--red); }
.label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: -.035em; line-height: 1; overflow-wrap: anywhere; }
.h2 { margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -.03em; line-height: 1.05; overflow-wrap: anywhere; }
.big { font-size: 104px; font-weight: 900; line-height: .9; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.ghost { color: var(--ghost); }
.lead { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.45; }
.code { font-size: 40px; font-weight: 900; letter-spacing: .04em; line-height: 1; font-variant-numeric: tabular-nums; }
.head { display: flex; flex-direction: column; gap: 6px; }

/* a section: small caps label over a 3px rule, then rows with 1px rules */
.section {
  margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding-bottom: 8px; border-bottom: 3px solid var(--ink);
}
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
  padding: 12px 0; border-bottom: 1px solid var(--ink); font-size: 16px;
}
.row .num { font-weight: 700; font-variant-numeric: tabular-nums; }
.row .side { color: var(--muted); font-size: 13px; text-align: right; }
.row.plain { grid-template-columns: minmax(0, 1fr) auto; }
a.row, button.row { width: 100%; text-align: left; text-decoration: none; color: inherit; background: none; border-width: 0 0 1px; border-style: solid; border-color: var(--ink); cursor: pointer; }
a.row:hover, button.row:hover { background: var(--faint); }

/* cells: label over value, in a grid under a 1px rule */
.cells {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px 16px;
  border-top: 1px solid var(--ink); padding-top: 12px;
}
.cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell .v { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }

/* switch: a square knob in a square track, filled when on */
.switch {
  width: 44px; height: 24px; flex: none; padding: 1px; border: 2px solid var(--ink); border-radius: 0;
  background: transparent; display: inline-flex; justify-content: flex-start; cursor: pointer;
}
.switch::after { content: ""; width: 18px; height: 18px; background: var(--ink); }
.switch[aria-checked="true"] { background: var(--ink); justify-content: flex-end; }
.switch[aria-checked="true"]::after { background: var(--paper); }
.switch:disabled { opacity: .4; cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; font-size: 17px; font-weight: 500; text-align: left; }

/* buttons: outlined, red for the one thing a screen is for, text buttons underlined */
.btn {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 18px;
  min-height: 44px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 0;
  background: transparent; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.go { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.go::after { content: ""; width: 14px; height: 14px; background: currentColor; flex: none; }
.btn.go:hover { background: var(--red-dark); border-color: var(--red-dark); }
.btn.block { width: 100%; min-height: 64px; padding: 0 18px; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
.btn.block::after { width: 18px; height: 18px; }
.btn:disabled { opacity: .45; cursor: default; }
.textbtn { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* inputs: a line under the text, or a 2px box where a form stands alone */
.line {
  width: 100%; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent;
  padding: 6px 0 8px; font-size: 17px; font-weight: 500; outline: none;
}
.line:focus { box-shadow: inset 0 -2px 0 var(--ink); }
.boxed {
  width: 100%; border: 2px solid var(--ink); border-radius: 0; background: var(--paper);
  padding: 12px; font-size: 16px; outline: none;
}
.line::placeholder, .boxed::placeholder { color: var(--muted); }

/* folds: a row with + and a minus when open */
details.fold { border-bottom: 1px solid var(--ink); }
details.fold > summary {
  list-style: none; display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; cursor: pointer;
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 18px; font-weight: 500; line-height: 1; }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > .inner { padding: 0 0 16px; }

/* the input level: twelve segments */
.meter { display: flex; gap: 4px; }
.meter span { flex: 1; height: 10px; background: var(--ghost); }
.meter span.on { background: var(--ink); }

.note { margin: 0; font-size: 14px; line-height: 1.45; }
.error { margin: 0; color: var(--red); font-size: 14px; font-weight: 700; }
.qr { width: 232px; max-width: 100%; background: #ffffff; padding: 12px; border: 3px solid var(--ink); }
.qr.big { width: 300px; }
.qr svg { width: 100%; height: auto; aspect-ratio: 1; display: block; }   /* a code must stay square to scan */
</style>

/* the way to connect a phone, always on the main screen: white on the red, the phone app's square */

.hero .add:hover::after { background: var(--paper); }
.hero .kick { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.hero h1 { margin: 0; font-size: 56px; font-weight: 900; letter-spacing: -.04em; line-height: .95; }
/* meetings that wait for Drive need the person's meeting agent: say so where they look */
.nudge { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--ink); color: var(--red); font-weight: 700; }
.steps { border-top: 3px solid var(--ink); }
.steps .row { grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; }
.steps .done { color: var(--red); font-weight: 700; font-size: 14px; }
.setting { align-items: center; }
.setting .line { width: 260px; max-width: 45vw; text-align: right; }
.setting .gstate { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.phone { grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 14px; }
/* a new agent token: where the MCP server is, the token (shown once), the skill */
.agentNew { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; padding: 14px 0; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); }
.agentNew .kv { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
.agentNew code { overflow-wrap: anywhere; font-size: 14px; }
.note.red { color: var(--red); font-weight: 700; margin: 0; }
/* connect: the code to scan, the code to type, and what the phone did */
.connect { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px 28px; align-items: start; }
.connect .qr { width: 248px; }
.connect .typed { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; }
.connect .steps .row { grid-template-columns: 40px minmax(0, 1fr); }
.wait { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.wait::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: blink 1.2s steps(2, start) infinite; }
.wait.ok::before { animation: none; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .wait::before { animation: none; } }
.here { min-height: 120px; gap: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  background: var(--red); color: var(--on-red); text-decoration: none; font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
.here::before { content: ""; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--on-red); }
@media (max-width: 560px) {
  main { padding: 16px 16px 36px; gap: 22px; }
  .h1 { font-size: 36px; } .h2 { font-size: 30px; } .hero h1 { font-size: 44px; } .hero { min-height: 150px; }
  .bar .extra, .brand .name { display: none; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero .count { display: none; }
  .hero .add { justify-self: start; }
  .setting .line { width: 160px; }
  .connect { grid-template-columns: minmax(0, 1fr); }
  .agentNew .kv { grid-template-columns: minmax(0, 1fr) auto; }
  .agentNew .kv .label { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<main>
  <header class="bar">
    <span id="barLeft"><span class="brand" id="brand"><span class="name" data-t="brand"></span></span><button id="back" data-t="back" hidden></button></span>
    <span class="end"><span><span id="status"></span><span class="extra" id="statusExtra"></span></span><button id="gear" data-t="settings"></button></span>
  </header>

  <p class="error" id="error" hidden></p>

  <section class="view" id="setup" hidden>
    <div class="head"><span class="kicker live" data-t="setupKick"></span><h1 class="h1" data-t="setupTitle"></h1></div>
    <p class="note" data-t="setupText"></p>
    <div class="rows steps">
      <div class="row"><span class="num">01</span><span data-t="setup1"></span><span></span></div>
      <div class="row"><span class="num">02</span><span data-t="setup2"></span><span></span></div>
    </div>
  </section>

  <section class="view" id="home" hidden>
    <div class="hero">
      <span class="dot" aria-hidden="true"></span>
      <span class="count" id="count"></span>
      <div class="words"><span class="kick" data-t="private"></span><h1 data-t="title"></h1></div>
      <button class="add" id="heroConnect" data-t="connectPhone" hidden></button>
    </div>
    <div class="nudge" id="nudge" hidden><span id="nudgeText"></span><button class="textbtn" id="nudgeBtn" data-t="nudgeBtn"></button></div>
    <div class="list irm" id="list"></div>
  </section>

  <section class="view" id="connect" hidden>
    <div class="head"><span class="kicker live" data-t="connectKick"></span><h1 class="h1" data-t="connectTitle"></h1></div>
    <a class="here" id="here" target="_blank" rel="noopener" hidden><span data-t="connectHere"></span></a>
    <div class="connect" id="codeBox">
      <div class="qr" id="qr"></div>
      <div>
        <div class="rows steps">
          <div class="row"><span class="num">01</span><span id="step1" data-t="step1"></span></div>
          <div class="row"><span class="num">02</span><span data-t="step2"></span></div>
          <div class="row"><span class="num">03</span><span data-t="step3"></span></div>
        </div>
        <div class="typed">
          <span class="label" data-t="orType"></span>
          <span class="code" id="code"></span>
          <span class="note muted" id="valid"></span>
        </div>
      </div>
    </div>
    <p class="note" id="httpNote" data-t="httpNote" hidden></p>
    <p class="wait" id="wait"></p>
    <div class="more"><button class="btn" id="newCode" data-t="newCode" hidden></button><button class="btn" id="connectDone" data-t="done"></button></div>
  </section>

  <section class="view" id="settings" hidden>
    <div class="head"><span class="kicker" data-t="settingsKick"></span><h1 class="h1" data-t="settings"></h1></div>
    <div id="youBox">
      <h2 class="section" data-t="you"></h2>
      <div class="rows">
        <label class="row plain setting"><span data-t="yourName"></span><input class="line" id="myName" maxlength="80"></label>
      </div>
      <p class="note muted" data-t="yourNameNote" style="margin-top: 10px"></p>
    </div>
    <div id="phonesBox">
      <h2 class="section" data-t="phones"></h2>
      <div class="rows" id="phones"></div>
      <p class="note muted" id="noPhones" data-t="noPhones" style="margin-top: 10px" hidden></p>
      <p style="margin-top: 16px"><button class="btn go" id="pairBtn" data-t="connectPhone"></button></p>
    </div>
    <div id="agentBox">
      <h2 class="section" data-t="agentHead"></h2>
      <p class="note" data-t="agentWhat" style="margin: 12px 0"></p>
      <div class="rows steps">
        <div class="row"><span class="num">01</span><span data-t="agent1"></span><span></span></div>
        <div class="row"><span class="num">02</span><span data-t="agent2"></span><span></span></div>
        <div class="row"><span class="num">03</span><span data-t="agent3"></span><span></span></div>
      </div>
      <p style="margin-top: 16px"><button class="btn go" id="agentBtn" data-t="agentBtn"></button></p>
      <p class="error" id="agentErr" hidden></p>
      <p class="note" id="agentSent" hidden></p>
    </div>
    <div id="agentWeb" hidden>
      <h2 class="section" data-t="agentHead"></h2>
      <p class="note" data-t="agentWebWhat" style="margin: 12px 0"></p>
      <p class="note muted" data-t="agentPrivacy" style="margin: 0 0 12px"></p>
      <div class="rows" id="agents"></div>
      <p class="note muted" id="noAgents" data-t="agentNoTokens" style="margin-top: 10px" hidden></p>
      <div class="rows" style="margin-top: 16px">
        <label class="row plain setting"><span data-t="agentName"></span><input class="line" id="agentName" maxlength="60" placeholder="Claude"></label>
      </div>
      <p style="margin-top: 16px"><button class="btn go" id="agentMake" data-t="agentMake"></button></p>
      <div class="agentNew" id="agentNew" hidden>
        <p class="note red" data-t="agentOnce"></p>
        <div class="kv"><span class="label" data-t="agentUrl"></span><code id="agentUrl"></code><button class="textbtn" data-copy="agentUrl" data-t="copy"></button></div>
        <div class="kv"><span class="label" data-t="agentToken"></span><code id="agentToken"></code><button class="textbtn" data-copy="agentToken" data-t="copy"></button></div>
        <div class="kv"><span class="label" data-t="agentSkill"></span><a id="agentSkill" target="_blank" rel="noopener"></a><span></span></div>
      </div>
      <p class="note" style="margin-top: 12px"><span data-t="agentHow"></span> <a href="/agent/" target="_blank" rel="noopener" data-t="agentDocs"></a></p>
      <p class="error" id="agentWebErr" hidden></p>
    </div>
    <div id="storageBox">
      <h2 class="section" data-t="storage"></h2>
      <div class="rows">
        <div class="row plain setting" id="gRow" hidden><span><span data-t="gdrive"></span><span class="gstate" id="gState"></span></span><button class="btn" id="gBtn"></button></div>
        <div class="row plain setting"><span id="lDefDrive" data-t="defaultDrive"></span><button class="switch" role="switch" aria-checked="false" id="defDrive" aria-labelledby="lDefDrive"></button></div>
        <label class="row plain setting"><span data-t="folder"></span><input class="line" id="folder" maxlength="120"></label>
        <div class="row plain setting"><span id="lAudio" data-t="audio"></span><button class="switch" role="switch" aria-checked="false" id="audio" aria-labelledby="lAudio"></button></div>
      </div>
      <p class="error" id="gErr" hidden></p>
      <p class="note muted" data-t="storageNote" style="margin-top: 10px"></p>
    </div>
    <div id="webBox" hidden><a class="btn" href="/logout" data-t="signOut"></a></div>
  </section>

  <article class="view irm" id="detail" hidden></article>
</main>
<script id="meetings">
/* Generated by integrations/indie-chat/inline_assets.py from recorder/static/meetings.js: edit that file, not this block. */
/* The meeting views every Minutes Pro app shares: the app in brainbot:agent
   command (integrations/indie-chat/inline_assets.py puts this file into it)
   and the phone web app; the Android app draws the same screens with the same
   words. A person's meetings by day, and one meeting: its summary, its
   speakers and their names, its transcript. Plain DOM. The host says how to
   reach the box, call(op, args) with the ops of the "indie-recorder"
   connector, in which language, what the box is called (box), whether
   meetings can go to Google Drive there (drive) and whether to link to the
   box's own meeting page (boxLink). */
(function () {
  'use strict';
  const STR = {
    en: {
      today: 'Today', yesterday: 'Yesterday', local: 'Local', processing: 'Processing', failed: 'Failed', uploading: 'Uploading',
      notYet: 'Not yet', length: 'Length', speakers: 'Speakers', drive: 'Google Drive', openFolder: 'Open folder',
      noteLocal: 'Stays on {box}.', noteWaiting: 'Waiting for the Drive upload.', noteDone: 'Stored in Drive.',
      queued: 'A new summary is on its way.', saved: 'Saved.',
      speakerNames: 'Speaker names', saveNames: 'Save names', unnamed: (n) => ` · ${n} without a name`,
      talk: (share, turns, first) => `${share}% of the talk · ${turns} turns · first at ${first}`,
      play: 'Play', stopPlay: 'Stop', use: (n) => `Use "${n}"`, nameLabel: 'Name',
      by: { recorder: 'In the meeting', agent: 'Your agent', person: 'You' },
      accentGuess: (s) => `Accent, a guess: ${s}`,
      accents: { english: 'English (England)', american: 'American', scottish: 'Scottish', irish: 'Irish', canadian: 'Canadian',
        northernirish: 'Northern Irish', indian: 'Indian', spanish: 'Spanish', dutch: 'Dutch', german: 'German', czech: 'Czech',
        polish: 'Polish', french: 'French', italian: 'Italian', hungarian: 'Hungarian', finnish: 'Finnish', vietnamese: 'Vietnamese',
        romanian: 'Romanian', slovak: 'Slovak', estonian: 'Estonian', lithuanian: 'Lithuanian', croatian: 'Croatian', slovene: 'Slovene' },
      transcript: 'Transcript', more: 'More', newSummary: 'Write a new summary', openBox: 'Open on {box}',
      tldr: 'Summary', decisions: 'Decisions', actions: 'Action items', questions: 'Open questions',
    },
    de: {
      today: 'Heute', yesterday: 'Gestern', local: 'Lokal', processing: 'In Arbeit', failed: 'Fehler', uploading: 'Lädt hoch',
      notYet: 'Noch nicht', length: 'Länge', speakers: 'Sprecher', drive: 'Google Drive', openFolder: 'Ordner öffnen',
      noteLocal: 'Bleibt auf {box}.', noteWaiting: 'Wartet auf das Hochladen nach Drive.', noteDone: 'In Drive abgelegt.',
      queued: 'Eine neue Zusammenfassung ist unterwegs.', saved: 'Gespeichert.',
      speakerNames: 'Namen der Sprecher', saveNames: 'Namen speichern', unnamed: (n) => ` · ${n} ohne Namen`,
      talk: (share, turns, first) => `${share} % der Redezeit · ${turns} Beiträge · zuerst bei ${first}`,
      play: 'Anhören', stopPlay: 'Stopp', use: (n) => `"${n}" übernehmen`, nameLabel: 'Name',
      by: { recorder: 'Im Meeting', agent: 'Ihr Agent', person: 'Sie' },
      accentGuess: (s) => `Akzent, geschätzt: ${s}`,
      accents: { english: 'Englisch (England)', american: 'Amerikanisch', scottish: 'Schottisch', irish: 'Irisch', canadian: 'Kanadisch',
        northernirish: 'Nordirisch', indian: 'Indisch', spanish: 'Spanisch', dutch: 'Niederländisch', german: 'Deutsch', czech: 'Tschechisch',
        polish: 'Polnisch', french: 'Französisch', italian: 'Italienisch', hungarian: 'Ungarisch', finnish: 'Finnisch', vietnamese: 'Vietnamesisch',
        romanian: 'Rumänisch', slovak: 'Slowakisch', estonian: 'Estnisch', lithuanian: 'Litauisch', croatian: 'Kroatisch', slovene: 'Slowenisch' },
      transcript: 'Transkript', more: 'Mehr', newSummary: 'Neue Zusammenfassung schreiben', openBox: 'Auf {box} öffnen',
      tldr: 'Zusammenfassung', decisions: 'Entscheidungen', actions: 'Aufgaben', questions: 'Offene Fragen',
    },
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');

  function create({ lang, call, fail = () => {}, onChange = () => {}, box = () => 'aibox1', drive = () => true, boxLink = true }) {
    const L = lang === 'de' ? 'de' : 'en';
    const t = (k) => {
      const v = STR[L][k] !== undefined ? STR[L][k] : STR.en[k];
      return typeof v === 'string' ? v.replace(/\{box\}/g, box()) : v;
    };
    const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;   // the local day
    function dayLabel(d) {
      if (dayKey(d) === dayKey(new Date())) return t('today');
      if (dayKey(d) === dayKey(new Date(Date.now() - 864e5))) return t('yesterday');
      return d.toLocaleDateString(L, { weekday: 'long', day: 'numeric', month: 'long' });
    }
    const time = (d) => d.toLocaleTimeString(L, { hour: '2-digit', minute: '2-digit' });
    function length(s) {
      s = Math.max(0, Math.round(s || 0));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
    }
    function stateCell(m) {
      if (m.state === 'uploading') return `<span class="state busy">${esc(t('uploading'))}</span>`;
      if (m.state === 'failed') return `<span class="state busy">${esc(t('failed'))}</span>`;
      if (m.state !== 'done') return `<span class="state busy">${esc(t('processing'))}</span>`;
      return `<span class="state">${esc(m.storage === 'drive' ? 'Drive' : t('local'))}</span>`;
    }
    const row = (m, n, d, tag) => `<${tag} ${tag === 'button' ? 'type="button" ' : ''}class="row mrow"${m.id ? ` data-id="${esc(m.id)}"` : ''}>` +
      `<span class="num">${pad(n)}</span><span class="title">${esc(m.title || m.id)}</span><span class="when tnum">${esc(time(d))}</span>` +
      `<span class="len tnum">${esc(length(m.duration_s))}</span>${stateCell(m)}</${tag}>`;

    /* The list by day, newest first. extra: what is not on the box yet (a
       phone's own uploads), {head, rows: [{title, started_at, duration_s, state}]}. */
    function list(el, meetings, onOpen, extra) {
      el.classList.add('irm', 'list');
      let html = extra && extra.rows.length
        ? `<div><h2 class="section">${esc(extra.head)}</h2><div class="rows">` +
          extra.rows.map((m, i) => row(m, i + 1, new Date(m.started_at), 'div')).join('') + '</div></div>'
        : '';
      let open = null, n = 0;
      for (const m of meetings) {
        const d = new Date(m.started_at || m.updated_at);
        if (dayKey(d) !== open) {
          if (open) html += '</div></div>';
          html += `<div><h2 class="section">${esc(dayLabel(d))}</h2><div class="rows">`;
          open = dayKey(d); n = 0;
        }
        html += row(m, ++n, d, 'button');
      }
      el.innerHTML = html + (open ? '</div></div>' : '');
      el.querySelectorAll('button.mrow').forEach((b) => b.addEventListener('click', () => onOpen(b.dataset.id)));
    }

    /* The recorder's summary as Swiss sections: the short version as the lead,
       then a section per heading with numbered rows; tables of action items
       become rows with the owner and the date on the right. */
    function summary(markdown) {
      const lines = String(markdown || '').split('\n').filter((l) => !/^# |^_.*_$|^https?:\/\/\S+$/.test(l.trim()));
      const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      const names = { 'tl;dr': 'tldr', kurzfassung: 'tldr', decisions: 'decisions', entscheidungen: 'decisions',
        'action items': 'actions', aufgaben: 'actions', 'open questions': 'questions', 'offene fragen': 'questions' };
      const parts = [];
      let cur = '', rows = null, n = 0, inTldr = false, first = true;
      const flush = () => { if (rows !== null) { cur += `<div class="rows">${rows}</div>`; rows = null; } };
      const next = (head) => { flush(); if (cur) parts.push(`<div>${cur}</div>`); cur = head || ''; n = 0; };
      const add = (html, side) => {
        n += 1;
        rows = (rows || '') + `<div class="row"><span class="num">${pad(n)}</span><span>${html}</span><span class="side">${esc(side || '')}</span></div>`;
      };
      for (const raw of lines) {
        const line = raw.trim();
        let m;
        if ((m = /^#{2,4}\s+(.*)/.exec(line))) {
          const key = names[m[1].toLowerCase()];
          inTldr = key === 'tldr';
          next(inTldr ? '' : `<h2 class="section">${esc(key ? t(key) : m[1])}</h2>`);
          continue;
        }
        if (/^\|[\s:|-]+\|$/.test(line) || /^\|\s*#\s*\|/.test(line)) continue;
        if ((m = /^\|(.*)\|$/.exec(line))) {
          const c = m[1].split('|').map((x) => x.trim());
          add(inline(c[1] || c[0]), [c[2], c[3]].filter((x) => x && !/^[-\u2013\u2014]$/.test(x)).join(' · '));
          continue;
        }
        if ((m = /^[-*]\s+(.*)/.exec(line))) { add(inline(m[1])); continue; }
        flush();
        if (line) { cur += (inTldr || first) ? `<p class="lead">${inline(line)}</p>` : `<p class="note">${inline(line)}</p>`; first = false; }
      }
      next();
      return parts.join('');
    }

    /* The transcript (render.py's Markdown) as turns: who and when, then what
       they said; the title line is the meeting's own, so it goes. */
    function transcript(markdown) {
      let html = '', turn = false, meta = true;
      for (const raw of String(markdown || '').split('\n')) {
        const line = raw.trim();
        let m;
        if (!line || /^# /.test(line)) continue;
        if ((m = /^\*\*(.+?)\*\*\s*·\s*([\d:]+)$/.exec(line))) {
          html += (turn ? '</div>' : '') + `<div class="turn"><p class="who"><strong>${esc(m[1])}</strong> <span class="muted tnum">${esc(m[2])}</span></p>`;
          turn = true; meta = false;
        } else if (meta || /^> /.test(line)) {
          html += `<p class="muted trmeta">${esc(line.replace(/^> /, ''))}</p>`;
          meta = false;
        } else {
          html += `<p>${esc(line)}</p>`;
        }
      }
      return html + (turn ? '</div>' : '');
    }

    /* Speaker cards, the most talkative first. Play: seven seconds of the voice
       from this meeting (a signed link, two hours). The accent: a guess from up
       to 30 s of their voice (engines/accent), only for English meetings, the
       likelier ones only. Use: puts a suggested name in the field; Save names
       applies them everywhere. */
    const accent = (list) => (list || []).filter((a) => a.p >= 0.1)
      .map((a) => `${t('accents')[a.accent] || a.accent} ${Math.round(a.p * 100)}%`).join(' · ');
    function speakers(cards) {
      return cards.map((c, i) => `<div class="spk">
        <div class="spkhead"><span class="num">${pad(i + 1)}</span><span class="who">${esc(c.label)}</span>
          <span class="side">${c.turns ? esc(t('talk')(c.share, c.turns, length(c.first))) : ''}</span>
          ${c.clip_url ? `<button type="button" class="textbtn play" data-url="${esc(c.clip_url)}">${esc(t('play'))}</button>` : '<span></span>'}</div>
        ${accent(c.accent) ? `<p class="said accent">${esc(t('accentGuess')(accent(c.accent)))}</p>` : ''}
        ${(c.lines || []).map((l) => `<p class="said">"${esc(l)}"</p>`).join('')}
        ${(c.suggestions || []).map((x) => `<p class="sugg"><button type="button" class="textbtn use" data-label="${esc(c.label)}" data-name="${esc(x.name)}">${esc(t('use')(x.name))}</button>` +
          `<span class="muted">${esc(t('by')[x.by] || '')}${x.why ? ': ' + esc(x.why) : ''}</span></p>`).join('')}
        <label class="cell"><span class="label">${esc(t('nameLabel'))}</span><input class="line" data-label="${esc(c.label)}" value="${esc(c.name)}"></label>
      </div>`).join('');
    }

    const player = new Audio();
    let playing = null, current = null;
    player.addEventListener('ended', () => { if (playing) playing.textContent = t('play'); playing = null; });
    function stop() { player.pause(); if (playing) playing.textContent = t('play'); playing = null; }

    /* One meeting into el. keepOpen: drawn again after a change, with the
       transcript and the speakers left open as they were. */
    async function meeting(el, id, keepOpen) {
      const m = await call('get_meeting', { meeting_id: id, include_transcript: false });
      const was = keepOpen && current && current.id === m.id && el.querySelector('#dTrBox')
        ? { tr: el.querySelector('#dTr').innerHTML, trOpen: el.querySelector('#dTrBox').open, spkOpen: el.querySelector('#dSpkBox') && el.querySelector('#dSpkBox').open }
        : null;
      stop();
      current = m;

/* The deployment's "indie-recorder" connector names the person to the recorder,
   so everyone sees only their own meetings. Without it (another deployment),
   a personal MCP server for the recorder does the same with its own token. */
async function call(tool, args) {
  if (VIA === 'mcp') return viaMcp(tool, args);
  try {
    const r = await IndieApp.fetch('indie-recorder', { op: tool, args: args || {} });
    VIA = 'connector';
    return r && r.result !== undefined ? r.result : r;
  } catch (e) {
    if (VIA === 'connector' || !/unknown connector/i.test(String(e && e.message))) throw e;
    VIA = 'mcp';
    return viaMcp(tool, args);
  }
}
async function findServer() {
  const list = await IndieApp.fetch('mcp', { op: 'list' });
  const s = (list.servers || []).find((x) => !x.error && (x.toolDefs || []).some((d) => /(^|_)pending_work$/.test(d.name)));
  if (!s) throw new Error('NO_SERVER');
  return s.name;
}
async function viaMcp(tool, args) {

  const r = await IndieApp.fetch('mcp', { op: 'call', server: SERVER, tool, args: args || {} });

  return r.text ? JSON.parse(r.text) : null;
}

}

}

    if (was[0] !== BOX || was[1] !== REACH) fillTexts();
    $('storageBox').hidden = !DRIVE;

    $('statusExtra').textContent = st.pending_drive ? t('forDrive')(st.pending_drive) : '';

    const g = st.google || {};
    $('nudge').hidden = !st.pending_drive || VIA !== 'connector' || !!g.connected;
    $('nudgeText').textContent = st.pending_drive ? (g.available ? t('nudgeGoogle') : t('nudge'))(st.pending_drive) : '';

    if (document.activeElement !== $('folder')) $('folder').value = settings.drive_folder || '';

    if (view === 'detail' && current) await openMeeting(current.id, true); else renderHome();
  } catch (e) { fail(e); }
}

async function setStorage(id, storage) {
  await call('set_storage', { meeting_id: id, storage });
  const m = meetings.find((x) => x.id === id); if (m) m.storage = storage;

}
async function updateSettings(patch) { settings = await call('update_settings', patch); return settings; }
async function rename(id, names) { await call('rename_speakers', { meeting_id: id, names }); await openMeeting(id, true); }

/* A switch flips at once and flips back if the box says no. */
function switchTo(el, apply) {
  el.addEventListener('click', () => {
    const v = !on(el); setOn(el, v);
    apply(v).catch((e) => { setOn(el, !v); fail(e); });
  });
}

async function loadPhones() {
  if (VIA === 'mcp') { $('phonesBox').hidden = true; $('youBox').hidden = true; $('agentBox').hidden = true; return; }   // they need the connector (it knows the person)
  if (WEB) { $('agentBox').hidden = true; $('agentWeb').hidden = false; $('webBox').hidden = false; loadAgents(); }
  try {
    const me = await call('whoami');
    if (document.activeElement !== $('myName')) $('myName').value = me.name || '';
    phoneList = await call('phones') || [];
    $('noPhones').hidden = phoneList.length > 0;
    $('phones').innerHTML = phoneList.map((p, i) => {
      const last = p.last_used_at ? t('lastUsed')(new Date(p.last_used_at).toLocaleDateString(LANG)) : t('unused');
      return `<div class="row phone"><span class="num">${pad(i + 1)}</span><span>${esc(p.name)}</span>` +
        `<span class="side">${esc(last)}</span><button class="textbtn" data-id="${esc(p.id)}">${esc(t('remove'))}</button></div>`;
    }).join('');
    $('phones').querySelectorAll('button').forEach((b) => b.addEventListener('click', async () => {
      try { await call('remove_phone', { id: b.dataset.id }); await loadPhones(); } catch (e) { fail(e); }
    }));
  } catch (e) { fail(e); }
}

/* The person's own agents (web mode): each gets a token for the MCP server. */
function renderAgents(list) {
  $('noAgents').hidden = list.length > 0;
  $('agents').innerHTML = list.map((a, i) => {
    const last = a.last_used_at ? t('lastUsed')(new Date(a.last_used_at).toLocaleDateString(LANG)) : t('unused');
    return `<div class="row phone"><span class="num">${pad(i + 1)}</span><span>${esc(a.name)}</span>` +
      `<span class="side">${esc(last)}</span><button class="textbtn" data-id="${esc(a.id)}">${esc(t('remove'))}</button></div>`;
  }).join('');
  $('agents').querySelectorAll('button').forEach((b) => b.addEventListener('click', async () => {
    try { $('agentNew').hidden = true; renderAgents((await call('revoke_agent_token', { id: b.dataset.id })).agents); }
    catch (e) { $('agentWebErr').textContent = e.message || String(e); $('agentWebErr').hidden = false; }
  }));
}
async function loadAgents() {
  try { renderAgents((await call('agent_tokens')).agents || []); } catch (e) { fail(e); }
}
$('agentMake').addEventListener('click', async () => {
  $('agentWebErr').hidden = true;
  try {
    const r = await call('new_agent_token', { name: $('agentName').value });
    $('agentUrl').textContent = r.mcp_url; $('agentToken').textContent = r.token;
    $('agentSkill').textContent = r.skill_url; $('agentSkill').href = r.skill_url;
    $('agentNew').hidden = false; $('agentName').value = '';
    renderAgents(r.agents || []);
  } catch (e) { $('agentWebErr').textContent = e.message || String(e); $('agentWebErr').hidden = false; }
});
document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($(b.dataset.copy).textContent); b.textContent = t('copied'); }
  catch (e) { getSelection().selectAllChildren($(b.dataset.copy)); }   // no clipboard over plain HTTP: select it instead
  setTimeout(() => { b.textContent = t('copy'); }, 2000);
}));

/* Connect a phone: one code, to scan or to type. It works once, for a quarter
   of an hour; the box tells us when a phone has used it. */
let waiting = null, expiry = null;
function stopWaiting() { clearInterval(waiting); clearTimeout(expiry); waiting = expiry = null; }
const onPhone = () => window.matchMedia('(max-width: 560px)').matches || /Android|iPhone|iPad/i.test(navigator.userAgent);

async function openConnect(from) {
  backTo = from || view;
  show('connect');
  $('wait').className = 'wait'; $('wait').textContent = t('waiting');
  $('httpNote').hidden = !(WEB && location.protocol === 'http:');
  $('newCode').hidden = true;
  try {
    const before = new Set((await call('phones') || []).map((p) => p.id));
    const r = await call('pair_phone');
    $('qr').innerHTML = r.qr;                               // SVG made by the recorder
    $('code').textContent = r.code;
    const until = new Date(r.expires_at);
    $('valid').textContent = t('valid')(time(until));
    $('here').href = r.url;
    $('here').hidden = !onPhone();
    stopWaiting();
    waiting = setInterval(async () => {
      try {
        const now = await call('phones') || [];
        const fresh = now.find((p) => !before.has(p.id));
        if (!fresh) return;
        stopWaiting();
        phoneList = now;
        $('wait').className = 'wait ok'; $('wait').textContent = t('connectedNow')(fresh.name);
        $('codeBox').hidden = true; $('here').hidden = true;
      } catch (e) { /* the next round tries again */ }
    }, 3000);
    expiry = setTimeout(() => {
      stopWaiting();
      $('wait').className = 'wait ok'; $('wait').textContent = t('expired');
      $('codeBox').hidden = true; $('here').hidden = true; $('newCode').hidden = false;
    }, Math.max(0, until - Date.now()));
    $('codeBox').hidden = false;
  } catch (e) { fail(e); }
}

$('gear').addEventListener('click', () => { show('settings'); loadPhones(); });
$('back').addEventListener('click', () => {
  if (view === 'connect' && backTo === 'settings') { show('settings'); loadPhones(); return; }
  current = null; M.stop(); show('home'); load();
});
$('pairBtn').addEventListener('click', () => openConnect('settings'));
$('heroConnect').addEventListener('click', () => openConnect('home'));
/* The meeting agent is the person's own, beside this app: the button hands it
   the set-up, and it asks the person to confirm Drive and its routine. */
$('agentBtn').addEventListener('click', async () => {
  $('agentErr').hidden = true; $('agentSent').hidden = true;
  try {
    await IndieApp.ask(t('agentAsk'));
    $('agentSent').textContent = t('agentSent'); $('agentSent').hidden = false;
  } catch (e) {
    $('agentErr').textContent = t('agentNone'); $('agentErr').hidden = false;
  }
});
$('nudgeBtn').addEventListener('click', () => {
  if (google && google.available && !google.connected) { connectGoogle(); return; }
  show('settings'); loadPhones();
  $(WEB ? 'agentWeb' : 'agentBox').scrollIntoView({ block: 'start' });
});

/* Google Drive: each person connects their own once, in a tab of its own
   (Google's sign-in cannot run in this frame); the recorder then uploads. */
function renderGoogle(g) {
  google = g || null;
  $('gRow').hidden = !(g && g.available) || VIA !== 'connector';     // connecting goes through the connector
  if (!g || !g.available) return;
  $('gState').textContent = g.connected ? t('gConnected')(g.email || '') : g.problem === 'expired' ? t('gExpired') : t('gNot');
  $('gBtn').textContent = g.connected ? t('gDisconnect') : t('gConnect');
  $('gBtn').classList.toggle('go', !g.connected);
}
async function connectGoogle() {
  $('gErr').hidden = true;
  try {
    const r = await call('drive_connect');
    window.open(r.url, '_blank', 'noopener');
    $('gState').textContent = t('gFinish');
    clearInterval(googleWait);
    let n = 0;
    googleWait = setInterval(async () => {
      const st = await call('status').catch(() => null);
      if ((st && st.google && st.google.connected) || ++n >= 60) { clearInterval(googleWait); load(); }
    }, 5000);
  } catch (e) { $('gErr').textContent = e.message || String(e); $('gErr').hidden = false; }
}
$('gBtn').addEventListener('click', async () => {
  if (!google || !google.connected) { connectGoogle(); return; }
  if (!confirm(t('gDisconnectAsk'))) return;
  try { renderGoogle(await call('drive_disconnect')); load(); } catch (e) { fail(e); }
});
$('newCode').addEventListener('click', () => openConnect(backTo));
$('connectDone').addEventListener('click', () => $('back').click());
switchTo($('defDrive'), (v) => updateSettings({ storage_default: v ? 'drive' : 'local' }));
switchTo($('audio'), (v) => updateSettings({ drive_include_audio: v }));
$('folder').addEventListener('change', () => updateSettings({ drive_folder: $('folder').value }).catch(fail));
$('myName').addEventListener('change', () => call('set_name', { name: $('myName').value }).catch(fail));

if (navigator.modelContext && navigator.modelContext.provideContext) {
  navigator.modelContext.provideContext({ tools: [
    { name: 'list_meetings', description: 'The meetings: id, title, start, state, storage (local or drive)', inputSchema: { type: 'object', properties: {} },
      async execute() { await load(); return JSON.stringify(meetings.map((m) => ({ id: m.id, title: m.title, started_at: m.started_at, state: m.state, storage: m.storage, drive_url: m.drive_url }))); } },
    { name: 'open_meeting', description: 'Show one meeting', inputSchema: { type: 'object', properties: { id: { type: 'string' } }, required: ['id'] },
      async execute(a) { await openMeeting(a.id); return 'Opened ' + a.id; } },
    { name: 'set_storage', description: 'Keep a meeting local or store it in Google Drive',
      inputSchema: { type: 'object', properties: { id: { type: 'string' }, storage: { type: 'string', enum: ['local', 'drive'] } }, required: ['id', 'storage'] },
      async execute(a) { return a.id + ': ' + await setStorage(a.id, a.storage); } },
    { name: 'set_default_storage', description: 'Where new recordings go by default', inputSchema: { type: 'object', properties: { storage: { type: 'string', enum: ['local', 'drive'] } }, required: ['storage'] },
      async execute(a) { await updateSettings({ storage_default: a.storage }); await load(); return 'Default: ' + a.storage; } },
    { name: 'rename_speakers', description: 'Name speaker labels, e.g. {"Speaker 1": "Luis"}',
      inputSchema: { type: 'object', properties: { id: { type: 'string' }, names: { type: 'object' } }, required: ['id', 'names'] },
      async execute(a) { await rename(a.id, a.names); return 'Saved'; } },
  ] });
}

(async () => {
  show('home');
  await load();
  // a meeting's link (/m/<id>) leads here as /#m=<id> in a browser on the recorder
  const asked = WEB && (/^#m=([\w.-]+)$/.exec(location.hash) || [])[1];
  if (asked) { history.replaceState(null, '', location.pathname); await openMeeting(asked); }
  setInterval(() => { if (document.visibilityState === 'visible' && view === 'home') load(); }, 30000);
})();
</script>
