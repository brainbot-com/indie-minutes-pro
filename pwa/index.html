<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<title>Minutes Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="../static/Inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../static/swiss.css">
<link rel="stylesheet" href="../static/meetings.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header class="bar">
    <span id="barLeft"><span class="brand" data-t="brand"></span><button id="back" data-t="back" hidden></button></span>
    <span class="end"><span id="status" data-t="notConnected"></span><button id="gear" type="button" data-t="settings" hidden></button></span>
  </header>

  <section class="view" id="pair" hidden>
    <div class="head"><span class="kicker live" data-t="setUp"></span><h1 class="h1" data-t="connectTitle"></h1></div>
    <div class="rows steps">
      <div class="row"><span class="num">01</span><span data-t="pair1"></span></div>
      <div class="row"><span class="num">02</span><span data-t="pair2"></span></div>
      <div class="row"><span class="num">03</span><span data-t="pair3"></span></div>
    </div>
    <form id="pairForm" class="view">
      <label class="cell"><span class="label" data-t="pairLabel"></span>
        <input class="boxed code" id="pairInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" required></label>
      <button class="btn go block" data-t="connect"></button>
    </form>
    <p class="error" id="pairError"></p>
    <p class="note muted" data-t="pairNote"></p>
  </section>

  <section class="view" id="ready" hidden>
    <div class="head">
      <span class="kicker" id="kicker" data-t="newRecording"></span>
      <span class="big ghost" id="clock" aria-live="off">00:00</span>
    </div>
    <div class="wave" id="waveBox" hidden><canvas id="wave" role="img"></canvas></div>
    <label class="cell" id="titleBox"><span class="label" data-t="title"></span>
      <input class="line title" id="title" maxlength="200" data-tp="optional"></label>
    <div class="cells">
      <div class="cell" id="titleCell" hidden><span class="label" data-t="title"></span><span class="v" id="titleNow"></span></div>
      <div class="cell"><span class="label" data-t="box"></span><span class="v" id="boxNow"></span></div>
      <div class="cell"><span class="label" id="lDrive" data-t="storage"></span>
        <button class="toggle" id="driveBtn" type="button"><span class="switch" role="switch" aria-checked="false" id="drive" aria-labelledby="lDrive"></span><span id="driveLabel"></span></button></div>
      <div class="cell" id="micCell" hidden><span class="label" data-t="mic"></span><span class="v" id="micNow"></span></div>
      <div class="cell" id="forCell" hidden><span class="label" id="forLabel"></span><span class="v" id="forNow"></span></div>
    </div>
    <button class="recbtn" id="rec" type="button"><span class="top"><span class="dot" aria-hidden="true"></span><span class="ask" data-t="askFirst"></span></span><span data-t="record"></span></button>
    <div class="pair2" id="live" hidden>
      <button class="blk ink" id="pause" type="button"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" id="pauseIcon"><rect x="3" y="2" width="7" height="22"></rect><rect x="16" y="2" width="7" height="22"></rect></svg><span id="pauseLabel" data-t="pause"></span></button>
      <button class="blk red" id="stop" type="button"><span class="sq" aria-hidden="true"></span><span data-t="stop"></span></button>
    </div>
    <p class="note" id="pausedNote" data-t="pausedNote" hidden></p>
    <p class="error" id="warn" hidden></p>
    <button class="btn listbtn" id="recsBtn" type="button" hidden>
      <span><span data-t="meetings"></span><span class="tnum count" id="recsCount"></span></span><span class="busy" id="recsBusy"></span>
    </button>
    </div>
  </section>

  <!-- the person's meetings from the box, and one meeting: recorder/static/meetings.js draws both, as in Minutes Pro -->
  <section class="view" id="meetings" hidden>
    <div class="head"><span class="kicker" data-t="private"></span><h1 class="h1" data-t="meetings"></h1></div>
    <p class="note error" id="net" hidden></p>
    <div id="mlist"></div>
    <p class="note muted" id="noRecs" data-t="noMeetings" hidden></p>
  </section>

  <article class="view" id="meeting" hidden></article>

  <section class="view" id="settings" hidden>
    <div class="head"><span class="kicker" data-t="thisPhone"></span><h1 class="h1" data-t="settings"></h1></div>
    <div>
      <h2 class="section" data-t="mic"></h2>
      <div class="rows">
        <div class="row plain setting"><span id="lVoice" data-t="voice"></span><button class="switch" role="switch" aria-checked="false" id="voiceproc" aria-labelledby="lVoice"></button></div>
      </div>
      <p class="note muted" data-t="voiceNote" style="margin-top: 10px"></p>
    </div>
    <div id="gBox" hidden>
      <h2 class="section" data-t="storage"></h2>
      <div class="rows">
        <div class="row plain setting"><span><span data-t="gdrive"></span><span class="gstate" id="gState"></span></span><button class="btn" id="gBtn" type="button"></button></div>
      </div>
      <p class="error" id="gErr" hidden></p>
    </div>
    <div>
      <h2 class="section" data-t="connection"></h2>
      <div class="rows">
        <div class="row plain"><span data-t="box"></span><span class="side" id="server"></span></div>
        <div class="row plain"><span data-t="thisPhoneIs"></span><span class="side" id="device"></span></div>
        <div class="row plain" id="personRow" hidden><span data-t="forWhom"></span><span class="side" id="person"></span></div>
      </div>
    </div>
    <div class="more">
      <a class="btn" href="/" id="webView"></a>
      <button class="textbtn red" id="unpair" type="button" data-t="unpair"></button>
      <a class="textbtn" id="privacyLink" target="_blank" rel="noopener" data-t="privacy"></a>
    </div>
  </section>
</main>
<script src="../static/meetings.js"></script>
<script src="app.js"></script>
</body>
</html>
